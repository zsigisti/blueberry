[package]
name     = "libxml2"
version  = "2.15.4"
release  = 1
summary  = "XML C parser and toolkit"
homepage = "https://gitlab.gnome.org/GNOME/libxml2/-/wikis/home"
license  = ["MIT"]
arch     = ["x86_64"]

depends     = ["zlib", "glibc", "readline"]
makedepends = ["python"]
provides    = ["libxml2.so"]
options     = ["!emptydirs"]

[[source]]
url    = "https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.4.tar.xz"
sha256 = "98087fd181d9070724f3fbc65c7377db03038eb92bd882374daff44940138821"

[steps]
build = '''
cd "$name-$version";
./configure --prefix=/usr --with-threads --with-history --with-icu=no --without-python --without-lzma --disable-static;
make
'''
package = '''
cd "$name-$version";
make DESTDIR="$pkgdir" install;
install -Dm644 Copyright "$pkgdir/usr/share/licenses/$name/Copyright"
'''
