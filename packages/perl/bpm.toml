[package]
name     = "perl"
version  = "5.40.5"
release  = 1
summary  = "A highly capable, feature-rich programming language"
homepage = "https://www.perl.org/"
license  = ["GPL-1.0-or-later", "Artistic-1.0-Perl"]
arch     = ["x86_64"]

depends = ["glibc", "gdbm", "libxcrypt"]

[upstream]
# perl ships development releases on odd minor versions (5.43.x, 5.45.x) into
# the same directory as the stable ones, and they are NOT for production — only
# even minors (5.40.x, 5.42.x, 5.44.x) are releases.
url   = "https://www.cpan.org/src/5.0/"
regex = "perl-(5\\.[0-9]*[02468]\\.[0-9]+)\\.tar"

[[source]]
# 5.40.5 is a security release on the 5.40 maintenance branch: per its
# perldelta it fixes CVE-2026-57432 (integer overflow in S_measure_struct ->
# out-of-bounds heap read in pack/unpack), CVE-2026-8376 (Perl_study_chunk
# buffer overflow) and CVE-2026-13221 (regex trie 16-bit field overflow).
# NVD's CPE ranges are still open-ended here, so `bpm audit` keeps flagging
# these three against 5.40.5 -- the perldelta is the authority.
url    = "https://www.cpan.org/src/5.0/perl-5.40.5.tar.xz"
sha256 = "1fe6f825b487d26c35aa51a35f52fe494d4cfc77b8051f8b1ee3391bf0289bc6"

[steps]
build = '''
cd "$name-$version";
./Configure -des \
  -Dprefix=/usr -Dvendorprefix=/usr \
  -Dprivlib=/usr/share/perl5/core_perl \
  -Darchlib=/usr/lib/perl5/core_perl \
  -Dsitelib=/usr/share/perl5/site_perl \
  -Dsitearch=/usr/lib/perl5/site_perl \
  -Dvendorlib=/usr/share/perl5/vendor_perl \
  -Dvendorarch=/usr/lib/perl5/vendor_perl \
  -Dman1dir=/usr/share/man/man1 -Dman3dir=/usr/share/man/man3 \
  -Dusethreads -Duseshrplib -Dinc_version_list=none \
  -Accflags='-std=gnu17 -fwrapv -fno-strict-aliasing';
make
'''
package = '''
cd "$name-$version";
make DESTDIR="$pkgdir" install;
install -Dm644 Copying "$pkgdir/usr/share/licenses/$name/Copying";
install -Dm644 Artistic "$pkgdir/usr/share/licenses/$name/Artistic"
'''
