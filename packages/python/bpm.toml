[package]
name     = "python"
version  = "3.14.7"
release  = 1
summary  = "CPython — the Python programming language interpreter"
homepage = "https://www.python.org/"
license  = ["Python-2.0.1"]
arch     = ["x86_64"]

depends     = ["glibc", "zlib", "openssl", "bzip2", "libffi", "xz", "ncurses", "readline", "gdbm", "mpdecimal", "sqlite", "expat", "util-linux", "zstd"]
provides    = ["python3"]

[upstream]
url   = "https://www.python.org/ftp/python/"
regex = "([0-9]+\\.[0-9]+\\.[0-9]+)/"
track = "3.14"   # series the tree is built against

[[source]]
url    = "https://www.python.org/ftp/python/3.14.7/Python-3.14.7.tar.xz"
sha256 = "3b48dac8fb59f62eaa67ac83c1eb12bda1b7a08406dd286e252c11a66be27f81"

[steps]
build = '''
cd "Python-$version";
./configure --prefix=/usr --enable-shared --with-system-expat --with-ensurepip=install --without-static-libpython;
make
'''
package = '''
cd "Python-$version";
make DESTDIR="$pkgdir" install;
ln -sf python3 "$pkgdir/usr/bin/python"
'''
