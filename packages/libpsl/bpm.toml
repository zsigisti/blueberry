[package]
name     = "libpsl"
version  = "0.23.1"
release  = 1
summary  = "Public Suffix List library"
homepage = "https://rockdaboot.github.io/libpsl/"
license  = ["MIT"]
arch     = ["x86_64"]

depends     = ["glibc", "libidn2", "libunistring"]
makedepends = ["meson", "ninja", "pkgconf", "libidn2", "libunistring", "python"]
provides    = ["libpsl.so"]

[[source]]
url    = "https://github.com/rockdaboot/libpsl/releases/download/0.23.1/libpsl-0.23.1.tar.gz"
sha256 = "8fbb03054556498ba9c4cc48fcaa36a4483748c6504a65bdb9ba348f555b0e56"

[steps]
build = '''
arch-meson "$name-$version" build -D runtime=libidn2 -D builtin=true
meson compile -C build
'''
package = '''
meson install -C build --destdir "$pkgdir"
'''
