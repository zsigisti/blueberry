[package]
name     = "less"
version  = "710"
release  = 1
summary  = "Terminal pager — the default pager for git, man and friends"
homepage = "https://www.greenwoodsoftware.com/less/"
license  = ["GPL-3.0-or-later"]
arch     = ["x86_64"]

depends     = ["glibc", "ncurses"]

[upstream]
url   = "https://www.greenwoodsoftware.com/less/download.html"
regex = "less-([0-9]+)\\.tar"

[[source]]
url    = "https://www.greenwoodsoftware.com/less/less-710.tar.gz"
sha256 = "d1008fb78dcae1323ddab664bcb352a61f022b1b131bd8018548e021d975ec7a"

[steps]
build = '''
cd "$name-$version";
./configure --prefix=/usr --sysconfdir=/etc --with-regex=posix;
make
'''
package = '''
cd "$name-$version";
make DESTDIR="$pkgdir" install;
install -Dm644 COPYING "$pkgdir/usr/share/licenses/$name/COPYING"
'''
