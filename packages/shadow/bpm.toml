[package]
name     = "shadow"
version  = "4.20.0"
release  = 1
summary  = "Password/account management (useradd, groupadd) + newuidmap/newgidmap for rootless containers"
homepage = "https://github.com/shadow-maint/shadow"
license  = ["BSD-3-Clause"]
arch     = ["x86_64"]

# newuidmap/newgidmap (setuid) give a non-root user its subordinate uid/gid
# ranges — the hard requirement for rootless podman. Also brings real
# useradd/usermod/groupadd (busybox only has adduser).
depends     = ["glibc", "pam", "libbsd", "libxcrypt", "acl", "attr", "systemd"]
makedepends = ["pkgconf", "pam", "libbsd", "libxcrypt", "systemd"]

[[source]]
url    = "https://github.com/shadow-maint/shadow/releases/download/4.20.0/shadow-4.20.0.tar.xz"
sha256 = "239781632846db3b01901028147fb4b57e6f2d5330ca63ce104b21d9b3e6031f"

[steps]
build = '''
cd "shadow-$version"
./configure --prefix=/usr --sysconfdir=/etc --disable-static \
    --without-selinux --with-libpam --enable-subordinate-ids
make
'''
package = '''
cd "shadow-$version"
make install DESTDIR="$pkgdir"
# util-linux ships su/login/nologin — drop shadow's copies of THOSE (it installs
# su to /bin, others to /usr/bin) to avoid file conflicts on install. But KEEP
# passwd: util-linux has no passwd and there is no busybox, so shadow's passwd is
# the only one on the system — without it root cannot change any password.
for t in su login nologin; do
    find "$pkgdir" -type f -name "$t" -delete 2>/dev/null || true
    find "$pkgdir/usr/share/man" -type f -name "$t.[0-9]" -delete 2>/dev/null || true
done
# passwd must be setuid root so a normal user can change their own password; the
# uid/gid mapping helpers must be setuid root for rootless containers.
chmod 4755 "$pkgdir/usr/bin/passwd" "$pkgdir/usr/bin/newuidmap" "$pkgdir/usr/bin/newgidmap"
# Subordinate-id maps (empty; useradd auto-assigns ranges per login.defs).
install -Dm644 /dev/null "$pkgdir/etc/subuid"
install -Dm644 /dev/null "$pkgdir/etc/subgid"
'''
