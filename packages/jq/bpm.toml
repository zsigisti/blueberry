[package]
name     = "jq"
version  = "1.8.2"
release  = 1
summary  = "Command-line JSON processor"
homepage = "https://jqlang.github.io/jq/"
license  = ["MIT"]
arch     = ["x86_64"]

depends     = ["glibc", "oniguruma"]
makedepends = ["pkgconf"]

[[source]]
url    = "https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-1.8.2.tar.gz"
sha256 = "71b8d6e8f5fe81f6c6d0d110e3892251f6ce76ed095abd315e26e6e1193af3af"

[steps]
build = '''
cd "$name-$version";
export CFLAGS="${CFLAGS:-} -Wno-error=incompatible-pointer-types";
./configure --prefix=/usr --disable-static --disable-maintainer-mode --with-oniguruma=/usr;
make
'''
package = '''
cd "$name-$version";
make DESTDIR="$pkgdir" install;
install -Dm644 COPYING "$pkgdir/usr/share/licenses/$name/COPYING"
'''
