[package]
name     = "nano"
version  = "8.7.1"
release  = 1
summary  = "Pico editor clone with enhancements"
homepage = "https://www.nano-editor.org/"
license  = ["GPL-3.0-or-later"]
arch     = ["x86_64"]

depends     = ["glibc", "ncurses", "file"]

[[source]]
url    = "https://www.nano-editor.org/dist/v8/nano-8.7.1.tar.xz"
sha256 = "76f0dcb248f2e2f1251d4ecd20fd30fb400a360a3a37c6c340e0a52c2d1cdedf"

[steps]
build = '''
cd "$name-$version";
./configure --prefix=/usr --sysconfdir=/etc --enable-utf8 --enable-color --enable-nanorc;
make
'''
package = '''
cd "$name-$version";
make DESTDIR="$pkgdir" install;
install -Dm644 COPYING "$pkgdir/usr/share/licenses/$name/COPYING"
'''
