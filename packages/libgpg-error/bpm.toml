[package]
name     = "libgpg-error"
version  = "1.61"
release  = 1
summary  = "Support library for libgcrypt"
homepage = "https://www.gnupg.org/"
license  = ["LGPL"]
arch     = ["x86_64"]

depends     = ["glibc"]
provides    = ["libgpg-error.so"]

[[source]]
url    = "https://gnupg.org/ftp/gcrypt/libgpg-error/libgpg-error-1.61.tar.bz2"
sha256 = "7a85413f2bc354f4f8aa832b718af122e48965e9e0eb9012ee659c13c6385c93"

[steps]
build = '''
cd "$name-$version";
./configure --prefix=/usr --disable-static;
make
'''
package = '''
cd "$name-$version";
make DESTDIR="$pkgdir" install
'''
