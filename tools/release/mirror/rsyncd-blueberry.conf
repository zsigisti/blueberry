# rsync module on the origin so mirrors can pull. Goes in /etc/rsyncd.conf,
# then `systemctl enable --now rsync`.
#
# Anonymous and read-only on purpose: it's public content and clients verify
# everything anyway. Never make it writable.
#
# Cloudflare doesn't proxy 873, so an off-site mirror needs either 873 open on
# a grey-clouded name (publishes the real IP) or rsync-over-SSH with a
# command-forced key. ufw keeps 873 closed for now, so it's localhost-only.
#
# Backups are excluded: a mirror serving an old but validly signed index is a
# downgrade attack.

uid = nobody
gid = nogroup
use chroot = yes
max connections = 50
timeout = 600

[blueberry-repo]
    path = /srv/blueberry-repo
    comment = Blueberry bpm package repository (read-only mirror source)
    read only = yes
    list = yes
    exclude = .index-backups/ *.tmp.*
