# nginx vhost for the repo, origin and mirrors alike. Plain HTTP; put TLS in
# front (Cloudflare or certbot). bpm checks every byte against the signed index.
#
# Caching:
#   *.bpm            a new version is a new filename, so cache forever
#   bpm.index(.sig)  tiny and changes, never cache - new packages show up at once
#   .index-backups/  never served. an old index with a valid signature is a
#                    downgrade attack waiting to happen
#
# Cloudflare won't edge-cache an unknown extension like .bpm no matter what the
# headers say. Add a Cache Rule (Caching -> Cache Rules):
#     If URI Path ends with ".bpm"
#     Then eligible for cache, Edge TTL = "Use cache-control header if present"
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /srv/blueberry-repo;
    autoindex on;
    default_type application/octet-stream;

    location ~ \.bpm$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/bpm\.index(\.sig)?$ {
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header Pragma "no-cache" always;
        try_files $uri =404;
    }

    location ^~ /.index-backups/ { return 404; }

    location / {
        add_header Cache-Control "no-store, max-age=0" always;
        try_files $uri $uri/ =404;
    }
}
