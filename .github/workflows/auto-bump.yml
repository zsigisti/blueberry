name: auto-bump

# Weekly: find recipes behind upstream and open one PR per package with the
# boring part done (version, URL, new sha256, release reset, versions baked
# into the build steps). Never pushes to master. Build it with bbdev before
# merging, CI can't.
#
# PRs opened with the default GITHUB_TOKEN don't trigger CI (GitHub's rule).
# Add a BUMP_TOKEN secret (fine-grained PAT, contents + pull-requests write)
# if you want CI on them.

on:
  schedule:
    - cron: "0 6 * * 1"      # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    name: open bump PRs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name  "blueberry-auto-bump"
          git config user.email "auto-bump@users.noreply.github.com"
      - name: Find outdated recipes and open a PR per package
        env:
          GH_TOKEN: ${{ secrets.BUMP_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          QUEUE_MAX: "12"     # most open auto-bump PRs to leave outstanding
        run: |
          set -euo pipefail
          outdated=$(python3 tools/pkg/check-updates.py --json \
            | python3 -c "import sys,json;[print(r['name'],r['latest']) for r in json.load(sys.stdin) if r.get('status')=='OUTDATED']")
          [ -n "$outdated" ] || { echo "nothing behind upstream"; exit 0; }

          # every bump needs a human build, so cap the queue at QUEUE_MAX and
          # list what got left out. uncapped, one sweep opened ~90 PRs and
          # nobody looked at any of them
          open=$(gh pr list --state open --limit 200 --json headRefName \
                   --jq '[.[] | select(.headRefName | startswith("auto-bump/"))] | length')
          slots=$(( QUEUE_MAX - open ))
          echo ":: $open auto-bump PRs open, room for $slots more (cap $QUEUE_MAX)"
          if [ "$slots" -le 0 ]; then
            echo ":: queue full, review the open bumps first; skipping this run"
            echo "$outdated" | sed 's/^/   pending: /'
            exit 0
          fi

          echo "$outdated" | while read -r pkg ver; do
            [ -n "$pkg" ] || continue
            if [ "$slots" -le 0 ]; then
              echo ":: cap reached, pending: $pkg $ver"; continue
            fi
            branch="auto-bump/${pkg}-${ver}"
            if gh pr list --head "$branch" --state all --json number --jq 'length' | grep -qv '^0$'; then
              echo ":: $pkg -> $ver already has a PR/branch, skipping"; continue
            fi
            git checkout -q master
            git checkout -qB "$branch"
            if ! summary=$(python3 tools/pkg/auto-bump.py "$pkg" --new-version "$ver" 2>&1); then
              echo ":: $pkg needs a human ($ver): $summary"
              git checkout -q -- . ; continue
            fi
            git commit -qam "pkg: bump $pkg to $ver (auto)"
            git push -q -u origin "$branch"
            {
              printf '%s\n\n' "$summary"
              printf 'Automated by the auto-bump workflow. Review before merge:\n\n'
              printf -- '- [ ] build-verified with `bbdev build %s`\n' "$pkg"
              printf -- '- [ ] soname unchanged if this is a shared library\n'
            } | gh pr create --head "$branch" --base master \
                  --title "pkg: bump $pkg to $ver" --body-file - \
              && { slots=$(( slots - 1 )); echo ":: opened PR for $pkg $ver ($slots slots left)"; }
          done
